# Baut das Spiel und veröffentlicht `dist/` auf GitHub Pages.
# Voraussetzung: Pages ist im Repo aktiviert (Settings → Pages → Source: GitHub Actions);
# auf dem Free-Plan braucht das ein öffentliches Repo.
# Nach dem Build prüft `tools/pages/check.ts` die Plattformgrenzen (R130, Schwelle 50 %).
# `vite.config.ts` setzt `base: './'` (relative Pfade), deshalb braucht der Build kein `--base`.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Plattformgrenze GitHub Pages prüfen (R130)
        run: node tools/pages/check.ts dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
