# Baut das Spiel und veröffentlicht `dist/` auf GitHub Pages.
# Voraussetzung: Pages ist im Repo aktiviert (Settings → Pages → Source: GitHub Actions);
# auf dem Free-Plan braucht das ein öffentliches Repo.
# Nach dem Build prüft `tools/pages/check.ts` die Plattformgrenzen (R130, Schwelle 50 %).
# `vite.config.ts` setzt `base: './'` (relative Pfade), deshalb braucht der Build kein `--base`.
# Auslösung (R747): automatisch nach grüner CI auf main (`workflow_run`); manuell (`workflow_dispatch`)
# nur für Reruns und die R450-Ausnahme: `gh workflow run Pages --ref main`.
name: Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Plattformgrenze GitHub Pages prüfen (R130)
        run: node tools/pages/check.ts dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
