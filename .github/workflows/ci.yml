name: CI
# R747: Repo ist öffentlich, Minuten zählen nicht; CI läuft bei jedem Push/PR, überholte Läufe desselben Refs werden abgebrochen.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make check
