name: CI
# Sparregeln (N-98): kein Lauf bei reinen Doku-/Studio-Änderungen, ältere Läufe desselben Refs werden abgebrochen.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.studio/**', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.studio/**', '.claude/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make check
